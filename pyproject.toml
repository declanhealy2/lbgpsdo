[project]
name = "lbgpsdo"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "hidapi>=0.15.0",
    "pyserial>=3.5",
]

[dependency-groups]
dev = [
    "ruff>=0.16.4",
]

[tool.pyright]
include = ["."]
extraPaths = ["."]
reportMissingImports = false
reportOptionalMemberAccess = false

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
